name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Not named "postgres" -- see idea-146's ci.yml for why a same-named
      # service container collides with pumpking's own production postgres
      # alias on the shared docker network.
      test-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dives_user
          POSTGRES_PASSWORD: dives
          POSTGRES_DB: test_dives
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test-postgres:5432/test_dives
      DATABASE_USER: dives_user
      DATABASE_PASSWORD: dives
      TEST_DATABASE_URL: postgres://dives_user:dives@test-postgres:5432/test_dives
      PASSWORD_AUTH_ENABLED: "true"
      DIVES_ADMIN_EMAIL: admin@example.com
      DIVES_ADMIN_PASSWORD: ci-admin-password
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      PLAYWRIGHT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'public/**/*', 'scripts/**/*', 'tests/**/*', '*.config.*', 'next.config.ts', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps webkit

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build
