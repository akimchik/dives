{{- if .Values.padiBackfillEnums.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # No deploymentId suffix, unlike the deployment's rollme annotation -- this Job is meant to run
  # exactly once. As long as this template's spec doesn't change, a fixed name means later deploys
  # (even with the flag still true) find the same completed Job already exists and no-op-reconcile
  # it instead of creating a fresh one that reruns the backfill.
  name: "{{ .Release.Name }}-padi-backfill-enums"
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}-padi-backfill-enums"
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}-padi-backfill-enums"
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: padi-backfill-enums
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["scripts/backfill-padi-enums.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $_ := .Values.appSecrets }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef:
                  name: "{{ $.Release.Name }}-app-secrets"
                  key: {{ $key | quote }}
          {{- end }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                  key: {{ .Values.databaseApp.usernameKey | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                  key: {{ .Values.databaseApp.passwordKey | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
