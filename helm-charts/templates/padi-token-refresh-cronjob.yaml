apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Release.Name }}-padi-token-refresh"
  labels:
    app.kubernetes.io/name: "{{ .Release.Name }}-padi-token-refresh"
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.padiTokenRefresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: "{{ .Release.Name }}-padi-token-refresh"
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: padi-token-refresh
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node"]
              args: ["scripts/padi-token-refresh.mjs"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                - name: OTEL_SERVICE_VERSION
                  value: "{{ .Values.deploymentId }}"
              {{- range $key, $value := .Values.env }}
                - name: {{ $key | quote }}
                  value: {{ $value | quote }}
              {{- end }}
              {{- range $key, $_ := .Values.appSecrets }}
                - name: {{ $key | quote }}
                  valueFrom:
                    secretKeyRef:
                      name: "{{ $.Release.Name }}-app-secrets"
                      key: {{ $key | quote }}
              {{- end }}
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                      key: {{ .Values.databaseApp.usernameKey | quote }}
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "databaseApp.secretName is required" .Values.databaseApp.secretName | quote }}
                      key: {{ .Values.databaseApp.passwordKey | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
